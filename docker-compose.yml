version: '3.8'

services:
  mcp-telegram-editor:
    build: .
    container_name: mcp-telegram-editor
    restart: unless-stopped
    network_mode: host
    volumes:
      - .:/app
      - /root/.local/bin/agy:/usr/local/bin/agy:ro
      - /root/.gemini:/root/.gemini
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
      - /lib64:/lib64:ro
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: mcp-telegram-editor-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=16MB
      -c max_connections=5
      -c work_mem=2MB
      -c maintenance_work_mem=8MB
      -c max_wal_size=128MB
      -c min_wal_size=32MB
      -c fsync=off
      -c logging_collector=off
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: mcp-telegram-editor-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 16mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
